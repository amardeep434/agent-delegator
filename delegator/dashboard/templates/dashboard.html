<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>delegator — Mission Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{bg:'#020617',surface:'#0F172A',border:'#1E293B',accent:'#22C55E',accentdim:'#166534',text:'#F8FAFC',muted:'#94A3B8',danger:'#EF4444',warn:'#F59E0B',info:'#3B82F6',purple:'#8B5CF6',pink:'#EC4899',cyan:'#06B6D4'},fontFamily:{mono:['JetBrains Mono','monospace'],sans:['Fira Sans','sans-serif']}}}}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;font-family:'Fira Sans',sans-serif;color:#F8FAFC;overflow-x:hidden;padding-bottom:44px}
.pulse-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pulse-dot.online{background:#22C55E;box-shadow:0 0 8px #22C55E;animation:pulse 2s infinite}
.pulse-dot.warning{background:#F59E0B;box-shadow:0 0 6px #F59E0B;animation:pulse 1.5s infinite}
.pulse-dot.danger{background:#EF4444;box-shadow:0 0 6px #EF4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.glass{background:#0F172A;border:1px solid #1E293B;border-radius:12px;transition:border-color 200ms}
.glass:hover{border-color:#334155}
.glass-sel{border-color:#22C55E!important;background:rgba(34,197,94,.06)!important}
.btn{font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 16px;border-radius:6px;cursor:pointer;transition:all 150ms;border:none;font-weight:600}
.btn-pri{background:#22C55E;color:#020617}.btn-pri:hover{background:#16A34A;box-shadow:0 0 16px rgba(34,197,94,.3)}
.btn-danger{background:transparent;color:#EF4444;border:1px solid rgba(239,68,68,.3)}.btn-danger:hover{background:rgba(239,68,68,.1);border-color:#EF4444}
.btn-ghost{background:transparent;color:#94A3B8;border:1px solid #1E293B}.btn-ghost:hover{color:#F8FAFC;border-color:#334155}
.btn-info{background:transparent;color:#3B82F6;border:1px solid rgba(59,130,246,.3)}.btn-info:hover{background:rgba(59,130,246,.1)}
.status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.s-ok{background:rgba(34,197,94,.15);color:#22C55E;border:1px solid rgba(34,197,94,.3)}.s-fail{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.3)}.s-warn{background:rgba(245,158,11,.15);color:#F59E0B;border:1px solid rgba(245,158,11,.3)}.s-info{background:rgba(59,130,246,.15);color:#3B82F6;border:1px solid rgba(59,130,246,.3)}.s-purple{background:rgba(139,92,246,.15);color:#8B5CF6;border:1px solid rgba(139,92,246,.3)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 5px;border-radius:3px;background:#1E293B;border:1px solid #334155;color:#94A3B8}
.input{background:#0F172A;border:1px solid #1E293B;color:#F8FAFC;padding:8px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color 200ms}.input:focus{border-color:#22C55E}
.select{background:#0F172A;border:1px solid #1E293B;color:#F8FAFC;padding:8px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:border-color 200ms}.select:hover{border-color:#22C55E}
.progress{height:6px;border-radius:3px;background:#1E293B;overflow:hidden}.fill-g{background:#22C55E;height:100%;border-radius:3px;transition:width 1s ease}.fill-y{background:#F59E0B}.fill-r{background:#EF4444}.fill-b{background:#3B82F6}
.tab{padding:8px 20px;cursor:pointer;border-bottom:2px solid transparent;transition:all 200ms;color:#64748B;font-size:13px;font-family:'JetBrains Mono',monospace}.tab.active{color:#22C55E;border-bottom-color:#22C55E}.tab:hover{color:#94A3B8}
.log{font-family:'JetBrains Mono',monospace;font-size:12px;padding:1px 0}.log.m{color:#64748B}.log.g{color:#22C55E}.log.y{color:#F59E0B}.log.b{color:#3B82F6}
.terminal{background:#020617;border:1px solid #1E293B;border-radius:8px;overflow:hidden}
.t-head{background:#0F172A;padding:8px 14px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #1E293B}
.t-dot{width:10px;height:10px;border-radius:50%}.t-dot.r{background:#EF4444}.t-dot.y{background:#F59E0B}.t-dot.g{background:#22C55E}
.t-body{padding:12px 14px;max-height:500px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:12px}
.typing::after{content:' ▌';animation:blink 1s step-end infinite;color:#22C55E}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.tooltip-trigger{position:relative;display:inline-flex;align-items:center}
.tooltip-content{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #475569;color:#E2E8F0;padding:10px 14px;border-radius:8px;font-size:11px;line-height:1.6;white-space:normal;z-index:200;max-width:320px;font-family:'Fira Sans',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
.tooltip-content b{color:#F8FAFC;font-family:'JetBrains Mono',monospace;font-size:10px}.tooltip-content code{color:#86EFAC;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(34,197,94,.1);padding:1px 4px;border-radius:3px}
.tooltip-trigger:hover .tooltip-content{display:block}
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(148,163,184,.15);color:#94A3B8;font-size:12px;font-weight:700;cursor:help;transition:all 150ms}.info-icon:hover{background:rgba(59,130,246,.2);color:#60A5FA}
.toast-panel{position:fixed;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:340px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.compare-col{border:2px dashed #1E293B;border-radius:8px;padding:12px}.compare-col.running{border-color:#22C55E;border-style:solid}
.metric-value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700}.metric-label{font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#020617}::-webkit-scrollbar-thumb{background:#1E293B;border-radius:3px}
body.light{background:#F8FAFC;color:#0F172A}body.light .glass{background:#FFFFFF;border-color:#E2E8F0}body.light .tab.active{color:#059669}body.light .terminal{background:#F1F5F9;border-color:#E2E8F0}body.light .t-body{background:#F8FAFC}.t-head{background:#E2E8F0}body.light .input,body.light .select{background:#F8FAFC;border-color:#CBD5E1;color:#0F172A}
#set-notifications .glass{overflow:visible}#set-notifications{overflow:visible}
</style>
</head>
<body class="min-h-screen p-6">
<div class="max-w-7xl mx-auto">

<!-- HEADER -->
<div class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-4">
    <h1 class="font-mono text-xl font-bold"><span style="color:#22C55E;text-shadow:0 0 14px rgba(34,197,94,.35)">◈</span> delegator</h1>
    <span class="text-xs text-muted">Mission Control</span>
    <span class="text-muted text-xs">|</span>
    <select class="select text-xs" style="padding:4px 8px" id="project-switcher" onchange="switchProject(this.value)"></select>
  </div>
  <div class="flex items-center gap-4">
    <button class="btn btn-info text-xs" style="padding:3px 10px" onclick="autoHeal()">🩺 Auto-Heal</button>
    <button class="text-xs text-muted font-mono hover:text-text" onclick="document.body.classList.toggle('light')">☀ Theme</button>
  </div>
</div>

<!-- ALERT BAR -->
<div class="glass mb-4 p-3 flex items-center justify-between" id="alert-bar" style="display:none;border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.04)">
  <div class="flex items-center gap-3 flex-wrap" id="alert-msg"></div>
</div>

<!-- METRICS -->
<div class="grid grid-cols-8 gap-3 mb-4" id="metrics-row"></div>

<!-- ACTIVE TASKS BANNER -->
<div class="glass mb-4 overflow-hidden" id="tasks-banner" style="display:none;border-color:rgba(59,130,246,.2)">
  <div class="flex items-center justify-between px-4 py-2" style="background:rgba(59,130,246,.04);border-bottom:1px solid rgba(59,130,246,.1)">
    <div class="flex items-center gap-2" id="task-count"></div>
    <button class="btn btn-ghost text-xs" onclick="document.getElementById('task-cards').classList.toggle('hidden')">Collapse</button>
  </div>
  <div class="grid grid-cols-3 divide-x divide-border" id="task-cards"></div>
</div>

<!-- MAIN GRID -->
<div class="grid grid-cols-12 gap-4">
  <!-- LEFT: Agent Cards -->
  <div class="col-span-2 flex flex-col gap-2" id="agent-cards"></div>

  <!-- RIGHT: Tabs -->
  <div class="col-span-10">
    <div class="flex gap-0 border-b border-border" id="tab-bar"></div>
    <div class="mt-4" id="tab-content"><div class="text-center text-muted text-sm pt-12">Loading...</div></div>
  </div>
</div>
</div>

<!-- TOAST -->
<div class="toast-panel"></div>

<!-- BOTTOM -->
<div style="position:fixed;bottom:0;left:0;right:0;background:#0F172A;border-top:1px solid #1E293B;padding:6px 24px;z-index:100;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;gap:24px">
  <span><span class="kbd">L</span> Live</span><span><span class="kbd">O</span> Logs</span><span><span class="kbd">H</span> History</span><span><span class="kbd">A</span> Analytics</span><span><span class="kbd">C</span> Compare</span><span><span class="kbd">Q</span> Queue</span><span><span class="kbd">E</span> Exec</span><span><span class="kbd">S</span> Settings</span>
  <span class="text-muted">|</span><span><span class="kbd">1-3</span> Tasks</span><span><span class="kbd">F7</span> Project</span><span><span class="kbd">⌘K</span> Focus Exec</span><span><span class="kbd">?</span> Help</span>
</div>

<script>
let liveTaskId=null,activeTab='live',settingsTab='routing';
const TABS=['live','logs','history','analytics','compare','queue','exec','settings'];
async function api(u,o){try{const r=await fetch(u,o);return r.ok?r.json():null}catch(e){return null}}

// === RENDER ALL ===
async function renderAll(){
  const d=await api('/api/status');if(!d)return;
  renderMetrics(d);renderAgents(d);renderTasks(d);renderAlert(d);
  const cds=document.querySelectorAll('#settings-sub #cooldown-list');
  if(cds.length){const cd=d.cooldowns||[];cds[0].innerHTML=cd.length?cd.map(c=>`<div class="flex items-center justify-between mb-1"><span class="font-mono text-xs">${c.key}</span><span class="status s-warn">cooldown</span></div>`).join(''):'<div class="font-mono text-xs text-accent">No active cooldowns</div>'}
}

function renderMetrics(d){
  document.getElementById('metrics-row').innerHTML=[['Active Agents',d.agents.length,'text-accent'],['Running',d.active_tasks.length,'text-info'],['7d Dels',d.recent_dels,'text-text'],['Success',Math.round((d.success_rate||0)*100)+'%','text-accent'],['Cooldowns',d.cooldowns.length,'text-warn'],['Queued',d.pending_queue||0,'text-purple'],['Routes',14,'text-pink'],['Cost','$'+(d.agents||[]).reduce((s,a)=>(s+(a.est_cost||0)),0).toFixed(2),'text-cyan']].map(([l,v,c])=>`<div class="glass p-3 text-center"><div class="metric-value ${c}">${v}</div><div class="metric-label">${l}</div></div>`).join('')
}

function renderAgents(d){
  document.getElementById('agent-cards').innerHTML=d.agents.map(a=>`<div class="glass p-3 cursor-pointer" onclick="openAgentModal('${a.name}')"><div class="flex items-center gap-2 mb-1"><span class="pulse-dot ${a.available?'online':'danger'}"></span><span class="font-mono text-xs font-semibold">${a.name}</span><span class="text-xs text-cyan ml-auto font-mono">$${a.est_cost||0}</span></div><div class="text-2xs text-muted">${a.current_model||'—'}</div><div class="flex items-center justify-between mt-2"><div class="progress flex-1 mr-2"><div class="fill-g" style="width:${Math.round((a.success_rate||0)*100)}%"></div></div><span class="text-2xs text-accent font-mono">${Math.round((a.success_rate||0)*100)}%</span></div><div class="text-2xs text-muted mt-1">${a.model_count} models · ${a.del_count||0} dels</div></div>`).join('')
}

function renderTasks(d){
  const tasks=d.active_tasks||[];const b=document.getElementById('tasks-banner');
  if(!tasks.length){b.style.display='none';return}
  b.style.display='';
  document.getElementById('task-count').innerHTML=`<span class="pulse-dot online"></span><span class="font-mono text-xs text-info font-semibold">${tasks.length} Active - Press 1-${Math.min(tasks.length,9)}</span>`;
  document.getElementById('task-cards').innerHTML=tasks.map((t,i)=>`<div class="p-3 cursor-pointer" id="task-${i}" onclick="document.querySelectorAll('#task-cards>div').forEach(e=>e.classList.remove('glass-sel'));this.classList.add('glass-sel');liveTaskId='${t.id}';switchTab('live')" style="border-bottom:1px solid #1E293B"><div class="flex items-center justify-between mb-1"><span class="font-mono text-xs text-info">#${(t.id||'').slice(0,8)}</span><div class="flex items-center gap-2"><span class="text-2xs text-muted font-mono">${Math.round(Date.now()/1000-(t.started_at||Date.now()/1000))}s</span><button class="btn btn-danger" style="padding:2px 8px;font-size:10px" onclick="event.stopPropagation();stopTask('${t.id}')">Stop</button></div></div><div class="text-xs text-muted mb-1">${t.agent||'—'} · ${t.model||'—'}</div><div class="text-xs text-text truncate">${t.task||'—'}</div><div class="progress mt-2"><div class="fill-g" style="width:${Math.min(Math.round((Date.now()/1000-(t.started_at||Date.now()/1000))/60*100),95)}%"></div></div></div>`).join('')
}

function renderAlert(d){
  const cds=d.cooldowns||[];const ab=document.getElementById('alert-bar');
  if(!cds.length){ab.style.display='none';return}
  ab.style.display='';document.getElementById('alert-msg').innerHTML=`<span class="font-mono text-xs text-danger">⚠ ${cds.length} agent(s) in cooldown:</span>${cds.map(c=>`<span class="font-mono text-xs text-warn mx-2">${c.key}</span>`).join('')}<button class="btn btn-info text-xs ml-3" style="padding:4px 10px" onclick="autoHeal()">Auto-Heal All</button><button class="btn btn-ghost text-xs ml-2" onclick="document.getElementById('alert-bar').style.display='none'">Dismiss</button>`
}

// === TAB RENDERERS ===
async function renderLive(){
  document.getElementById('tab-content').innerHTML=liveTaskId?`<div class="terminal"><div class="t-head"><div class="t-dot g"></div><span class="font-mono text-xs text-muted">delegator live — ${liveTaskId.slice(0,8)}</span></div><div class="t-body" id="live-body" style="max-height:550px"><div class="log m">Loading...</div></div></div><div class="glass p-3 mt-3 flex items-center gap-3"><span class="font-mono text-xs text-muted" id="live-task-info"></span><div class="flex gap-2 ml-auto"><button class="btn btn-danger" onclick="stopTask()">Stop</button><button class="btn btn-ghost" onclick="execTask()">Rerun</button><button class="btn btn-ghost" onclick="navigator.clipboard.writeText(document.querySelector('.t-body')?.textContent||'');showToast('Copied!')">Copy</button></div></div>`:'<div class="glass p-6 text-center"><div class="text-muted text-sm mb-2">No task selected</div><div class="font-mono text-xs text-accentdim">Click an active task above or execute a new task</div></div>';
  if(liveTaskId)loadLiveOutput()
}
async function loadLiveOutput(){
  const d=await api('/api/tasks/'+liveTaskId+'/output');
  const b=document.getElementById('live-body');
  if(b&&d){b.innerHTML=`<div class="log g">Status: ${d.status||'unknown'}</div><div class="log m whitespace-pre-wrap">${d.output||'No output yet'}</div>`}
}

async function renderLogs(){
  const d=await api('/api/logs?limit=200');const entries=d?d.entries:[];
  document.getElementById('tab-content').innerHTML=`<div class="flex items-center gap-3 mb-3 flex-wrap"><span class="text-xs text-muted font-mono">Filter:</span><select class="select text-xs" style="padding:4px 8px" onchange="renderLogsFiltered()"><option>All agents</option>${[...new Set(entries.map(e=>e.agent))].map(a=>`<option>${a}</option>`).join('')}</select><select class="select text-xs" style="padding:4px 8px" onchange="renderLogsFiltered()"><option>All levels</option><option>ERROR</option><option>INFO</option></select><input class="input text-xs" style="max-width:200px;padding:4px 8px" placeholder="Search..." onkeyup="renderLogsFiltered()"><span class="text-xs text-muted font-mono ml-auto">${entries.length} entries</span><button class="btn btn-ghost text-xs" style="padding:3px 8px" onclick="exportText('logs')">Export</button></div><div class="terminal" style="max-height:550px;overflow-y:auto" id="log-stream">${entries.map(e=>`<div class="flex items-start gap-2 py-1 px-3${e.level==='ERROR'?'" style="background:rgba(239,68,68,.05)':''}"><span class="text-2xs text-muted font-mono whitespace-nowrap">${e.timestamp||'—'}</span><span class="text-2xs text-muted font-mono whitespace-nowrap w-16">${e.agent||'—'}</span><span class="text-2xs text-info font-mono w-12">#${(e.task_id||'').slice(0,8)}</span><span class="text-2xs font-mono whitespace-nowrap" style="color:${e.level==='ERROR'?'#EF4444':'#3B82F6'}">${e.level}</span><span class="text-xs text-text">${e.message||''}</span></div>`).join('')||'<div class="text-center text-muted text-xs p-4">No log entries yet</div>'}</div>`
}
let _logEntries=[];async function renderLogsFiltered(){
  if(!_logEntries.length){const d=await api('/api/logs?limit=500');_logEntries=d?d.entries:[]}
  const ag=document.querySelector('#tab-content select')?.value;const lv=document.querySelectorAll('#tab-content select')[1]?.value;const q=document.querySelector('#tab-content input')?.value?.toLowerCase()||'';let e=_logEntries;if(ag&&ag!=='All agents')e=e.filter(x=>x.agent===ag);if(lv&&lv!=='All levels')e=e.filter(x=>x.level===lv);if(q)e=e.filter(x=>JSON.stringify(x).toLowerCase().includes(q));const s=document.getElementById('log-stream');if(s)s.innerHTML=e.map(e=>`<div class="flex items-start gap-2 py-1 px-3${e.level==='ERROR'?'" style="background:rgba(239,68,68,.05)':''}"><span class="text-2xs text-muted font-mono whitespace-nowrap">${e.timestamp||'—'}</span><span class="text-2xs text-muted font-mono whitespace-nowrap w-16">${e.agent||'—'}</span><span class="text-2xs text-info font-mono w-12">#${(e.task_id||'').slice(0,8)}</span><span class="text-2xs font-mono whitespace-nowrap" style="color:${e.level==='ERROR'?'#EF4444':'#3B82F6'}">${e.level}</span><span class="text-xs text-text">${e.message||''}</span></div>`).join('')||'<div class="text-center text-muted text-xs p-4">No matching entries</div>'
}

async function renderHistory(){
  const d=await api('/api/metrics?days=14&limit=100');const dels=d?d.delegations:[];
  document.getElementById('tab-content').innerHTML=`<div class="flex items-center gap-3 mb-3"><select class="select text-xs" style="padding:4px 8px" onchange="renderHistory()"><option>All agents</option>${[...new Set(dels.map(r=>r.to_agent||r.provider_used||'—'))].map(a=>`<option>${a}</option>`).join('')}</select><span class="text-xs text-muted font-mono ml-auto">${dels.length} records</span><button class="btn btn-ghost text-xs" style="padding:3px 8px" onclick="exportText('history')">CSV Export</button></div><div class="glass overflow-hidden"><table class="w-full text-xs"><thead><tr class="text-muted font-mono uppercase tracking-wider" style="background:rgba(30,41,59,.3)"><th class="text-left py-2 px-3">Time</th><th class="text-left py-2 px-3">Agent</th><th class="text-left py-2 px-3">Model</th><th class="text-left py-2 px-3">Task</th><th class="text-left py-2 px-3">WF</th><th class="text-center py-2 px-3">Dur</th><th class="text-center py-2 px-3">FB</th><th class="text-center py-2 px-3">St</th><th class="text-center py-2 px-3"></th></tr></thead><tbody>${dels.map(r=>`<tr style="border-bottom:1px solid #1E293B"><td class="py-2 px-3 font-mono text-muted">${(r.timestamp||'').slice(11,16)||'—'}</td><td class="py-2 px-3 font-mono">${r.to_agent||r.provider_used||'—'}</td><td class="py-2 px-3 font-mono text-xs text-accent">${(r.model||'').slice(0,18)}</td><td class="py-2 px-3 truncate max-w-xs" title="${r.task_type||''}">${r.task_type||'—'}</td><td class="py-2 px-3 font-mono text-muted">${r.workflow||'—'}</td><td class="py-2 px-3 font-mono text-muted text-center">${r.duration_ms?Math.round(r.duration_ms/1000)+'s':'—'}</td><td class="py-2 px-3 font-mono text-muted text-center">${r.fallback_count||0}</td><td class="py-2 px-3 text-center"><span class="status ${r.success?'s-ok':'s-fail'}">${r.success?'OK':'FAIL'}</span></td><td class="py-2 px-3 text-center flex gap-1 justify-center"><button class="btn btn-ghost" style="padding:2px 6px;font-size:9px" onclick="viewDelegation('${r.id}')">View</button>${!r.success?`<button class="btn btn-ghost" style="padding:2px 6px;font-size:9px" onclick="rerunExec()">Retry</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="text-center text-muted p-4">No delegations yet</td></tr>'}</tbody></table></div>`
}
async function viewDelegation(id){const d=await api('/api/metrics?days=30&limit=100');if(!d)return;const del=d.delegations.find(r=>r.id===id);alert(del?`#${del.id}\nAgent: ${del.to_agent}\nModel: ${del.model}\nWorkflow: ${del.workflow}\nTask: ${del.task_type}\nDuration: ${del.duration_ms||0}ms\nFallbacks: ${del.fallback_count||0}\nSuccess: ${del.success}`:'Not found')}

async function renderAnalytics(){
  const d=await api('/api/metrics?days=14&limit=200');if(!d)return;const dels=d.delegations;
  const byAgent={};dels.forEach(r=>{const a=r.to_agent||'?';byAgent[a]=(byAgent[a]||0)+1});const maxA=Math.max(1,...Object.values(byAgent));
  const byDay={};dels.forEach(r=>{const dd=(r.timestamp||'').slice(0,10);if(!byDay[dd])byDay[dd]={t:0,o:0};byDay[dd].t++;if(r.success)byDay[dd].o++});const days=Object.entries(byDay).slice(-7);const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const costs={};dels.forEach(r=>{const a=r.to_agent||'?';costs[a]=(costs[a]||0)+(r.duration_ms||0)*0.000001});
  const fails=dels.filter(r=>!r.success);
  document.getElementById('tab-content').innerHTML=`<div class="grid grid-cols-3 gap-4 mb-4"><div class="glass p-4"><h3 class="font-mono text-xs text-muted uppercase tracking-wider mb-3">Success Rate (7d)</h3><div class="flex items-end gap-1 h-24">${days.map(([dd,data])=>{const dt=new Date(dd+'T00:00:00');const pct=data.t?Math.round(data.o/data.t*100):0;const cls=pct>80?'g':pct>50?'y':'r';return`<div class="flex flex-col items-center" title="${dd}: ${data.o}/${data.t}"><div class="progress h-full flex items-end" style="width:14px"><div class="fill-${cls}" style="width:100%;height:${pct}%;min-height:2px;border-radius:2px 2px 0 0"></div></div><span class="text-2xs text-muted mt-1">${dn[dt.getDay()]}</span></div>`}).join('')}</div></div><div class="glass p-4"><h3 class="font-mono text-xs text-muted uppercase tracking-wider mb-3">Delegations by Agent</h3>${Object.entries(byAgent).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`<div class="mb-3"><div class="flex justify-between text-2xs font-mono mb-1"><span>${a}</span><span class="text-accent">${c}</span></div><div class="progress"><div class="fill-g" style="width:${Math.round(c/maxA*100)}%"></div></div></div>`).join('')}</div><div class="glass p-4"><h3 class="font-mono text-xs text-muted uppercase tracking-wider mb-3">Cost Breakdown</h3>${Object.entries(costs).map(([a,c])=>`<div class="flex justify-between text-xs font-mono mb-2"><span>${a}</span><span class="text-cyan">$${c.toFixed(2)}</span></div>`).join('')}<div class="border-t border-border pt-2 mt-2 flex justify-between font-bold font-mono text-xs"><span>Total</span><span class="text-cyan">$${Object.values(costs).reduce((a,b)=>a+b,0).toFixed(2)}</span></div><div class="flex gap-2 mt-3"><button class="btn btn-ghost text-xs flex-1" style="padding:3px 8px;font-size:10px" onclick="exportCSV()">CSV</button><button class="btn btn-ghost text-xs flex-1" style="padding:3px 8px;font-size:10px" onclick="exportCSV()">PDF</button></div></div></div><div class="grid grid-cols-2 gap-4"><div class="glass p-4"><h3 class="font-mono text-xs text-muted uppercase tracking-wider mb-3">Failure Types</h3>${[['Rate Limit',fails.filter(r=>r.fallback_count>0).length,'y'],['Other',fails.filter(r=>r.fallback_count===0).length,'r']].map(([l,v,c])=>`<div class="mb-3"><div class="flex justify-between text-2xs font-mono mb-1"><span>${l}</span><span class="text-warn">${v}</span></div><div class="progress"><div class="fill-${c}" style="width:${v}%"></div></div></div>`).join('')}</div><div class="glass p-4"><h3 class="font-mono text-xs text-muted uppercase tracking-wider mb-3">Learned Rankings</h3>${[...new Map(dels.map(r=>[r.to_agent,r])).values()].slice(0,5).map(r=>{const ad=dels.filter(x=>x.to_agent===r.to_agent);const sc=ad.filter(x=>x.success).length/ad.length;return`<div class="flex justify-between text-xs font-mono mb-2"><span style="color:${sc>0.8?'#22C55E':sc>0.5?'#F59E0B':'#EF4444'}">${r.to_agent||'?'}</span><span>${sc.toFixed(2)}</span><span class="text-muted">${ad.length} dels</span></div>`}).join('')}</div></div>`
}

async function renderCompare(){
  const models=['opencode-go/deepseek-v4-pro','claude-sonnet-4-6','opencode-go/minimax-m2.7','federated-coding','federated-free','copilot/gpt-5.4'];
  document.getElementById('tab-content').innerHTML=`<div class="flex items-center gap-3 mb-4"><input class="input flex-1" id="compare-task" placeholder="Task description..." value=""><button class="btn btn-pri" onclick="runCompare()">Run A/B Test</button></div><div class="grid grid-cols-2 gap-4"><div class="compare-col"><div class="flex items-center justify-between mb-2"><span class="font-mono text-xs font-semibold">A:</span><select class="select compare-sel text-xs" style="padding:4px 8px">${models.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="terminal" style="min-height:200px"><div class="t-head"><div class="t-dot g"></div><span class="font-mono text-2xs text-muted">Output</span></div><div class="t-body" style="min-height:150px"><div class="text-muted text-xs text-center pt-6">Ready. Run A/B Test to compare.</div></div></div></div><div class="compare-col"><div class="flex items-center justify-between mb-2"><span class="font-mono text-xs font-semibold">B:</span><select class="select compare-sel text-xs" style="padding:4px 8px">${models.map(m=>`<option ${m==='claude-sonnet-4-6'?'selected':''}>${m}</option>`).join('')}</select></div><div class="terminal" style="min-height:200px"><div class="t-head"><div class="t-dot g"></div><span class="font-mono text-2xs text-muted">Output</span></div><div class="t-body" style="min-height:150px"><div class="text-muted text-xs text-center pt-6">Ready.</div></div></div></div></div>`

async function runCompare(){const task=document.getElementById('compare-task')?.value;if(!task)return;const ma=document.querySelectorAll('.compare-sel')[0]?.value;const mb=document.querySelectorAll('.compare-sel')[1]?.value;document.querySelectorAll('.compare-col').forEach(c=>c.classList.add('running'));document.querySelectorAll('.t-body').forEach(b=>b.innerHTML='<div class="log b">Running...</div>');const d=await api('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,model_a:ma,model_b:mb})});if(!d)return;['A','B'].forEach((lbl,i)=>{const r=d.results[lbl];if(r){const b=document.querySelectorAll('.t-body')[i];if(b)b.innerHTML=`<div class="log g">${r.success?'✅':'❌'} Provider: ${r.provider||'—'}</div><div class="log m">Duration: ${r.duration_ms?Math.round(r.duration_ms/1000)+'s':'—'}</div><div class="log m">Fallbacks: ${r.fallback_count||0}</div><div class="log m whitespace-pre-wrap">${(r.output||'').slice(0,500)}</div>`}})}

// === TAB SWITCH ===
function switchTab(t){activeTab=t;document.querySelectorAll('#tab-bar .tab').forEach((e,i)=>{e.classList.toggle('active',TABS[i]===t)});if(t==='live')renderLive();if(t==='logs'){renderLogs();_logEntries=[]}if(t==='history')renderHistory();if(t==='analytics')renderAnalytics();if(t==='compare')renderCompare();if(t==='queue')renderQueue();if(t==='exec')renderExec();if(t==='settings')renderSettings();if(window.tailwind)tailwind.refresh()}

// === ACTIONS ===
async function execTask(){const t=document.getElementById('exec-task');if(!t?.value)return switchTab('exec');const r=await api('/api/exec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:t.value,model:document.getElementById('exec-model')?.value||'federated-coding',workflow:document.getElementById('exec-wf')?.value||'subagent-driven',from_agent:document.getElementById('exec-from')?.value||'',stream:document.getElementById('exec-stream')?.checked||false,no_worktree:document.getElementById('exec-no-wt')?.checked||false})});if(r){liveTaskId=r.task_id;switchTab('live');renderAll();showToast('Task started')}}
async function stopTask(id){await api('/api/tasks/'+(id||liveTaskId||'')+'/stop',{method:'POST'});showToast('Task stopped');renderAll()}
async function autoHeal(){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'auto_heal'})});renderAll();showToast('Cooldowns reset')}
async function execFromQueue(task,model){const r=await api('/api/exec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,model:model||'federated-coding',no_worktree:true})});if(r){liveTaskId=r.task_id;switchTab('live');renderAll()}}

  const d=await api('/api/agents/'+name);if(!d?.models)return;
  const m=document.createElement('div');m.className='modal-overlay';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center';
  m.innerHTML=`<div class="glass" style="padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto" onclick="event.stopPropagation()"><div class="flex items-center justify-between mb-4"><h3 class="font-mono text-sm font-semibold">${name} — Agent Details</h3><button class="text-muted text-xl" onclick="this.closest('.modal-overlay').remove()">×</button></div><table class="w-full text-xs"><thead><tr class="text-muted font-mono uppercase" style="background:rgba(30,41,59,.3)"><th class="text-left py-2 px-3">Model</th><th class="text-left py-2 px-3">Capabilities</th><th class="text-center py-2 px-3">Dels</th><th class="text-center py-2 px-3">Success</th></tr></thead><tbody>${d.models.map(m=>`<tr style="border-bottom:1px solid #1E293B"><td class="py-2 px-3 font-mono text-accent">${m.id}</td><td class="py-2 px-3">${(m.capabilities||[]).map(c=>`<span class="status s-info">${c}</span>`).join(' ')}</td><td class="py-2 px-3 text-center font-mono">${m.total_dels}</td><td class="py-2 px-3 text-center font-mono" style="color:${m.success_rate>0.8?'#22C55E':'#F59E0B'}">${Math.round(m.success_rate*100)}%</td></tr>`).join('')}</tbody></table></div>`;
  m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m)
}
function showToast(msg){const p=document.querySelector('.toast-panel');if(!p)return;const d=document.createElement('div');d.className='glass p-3 flex items-center gap-3';d.style.cssText='animation:slideIn .3s ease;font-family:monospace;font-size:11px';d.innerHTML=`<span class="pulse-dot online"></span>${msg}<span style="cursor:pointer;margin-left:12px;font-size:14px" onclick="this.parentElement.remove()">×</span>`;p.appendChild(d);setTimeout(()=>d.remove(),8000)}
function exportText(type){const c=document.getElementById('tab-content')?.textContent||'';const b=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`delegator-${type}.txt`;a.click()}
function exportCSV(){exportText('analytics')}

// === INIT ===
(async function(){
  document.getElementById('tab-bar').innerHTML=TABS.map(t=>`<div class="tab ${t===activeTab?'active':''}" onclick="switchTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</div>`).join('');
  await loadProjects();await renderAll();switchTab('live');if(window.tailwind)tailwind.refresh();
  setInterval(()=>{renderAll();if(window.tailwind)tailwind.refresh()},5000);setInterval(()=>{if(activeTab==='logs')_logEntries=[];renderLogs();if(window.tailwind)tailwind.refresh()},8000);setInterval(()=>{if(activeTab==='live'&&liveTaskId)loadLiveOutput()},4000);
})();
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;const m={'l':'live','o':'logs','h':'history','a':'analytics','c':'compare','q':'queue','e':'exec','s':'settings'};if(m[e.key])switchTab(m[e.key]);if(e.key==='F7'){e.preventDefault();document.getElementById('project-switcher')?.focus()}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();switchTab('exec');setTimeout(()=>document.getElementById('exec-task')?.focus(),200)}if(e.key==='?'){e.preventDefault();showToast('Keys: L Live O Logs H History A Analytics C Compare Q Queue E Exec S Settings · 1-3 Tasks · F7 Project · ⌘K Exec · Esc Close')}})
</script>
</body>
