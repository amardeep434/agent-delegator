<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>delegator — Mission Control</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;font-family:'Fira Sans',sans-serif;color:#F8FAFC;overflow-x:hidden;padding-bottom:40px}
.glass{background:#0F172A;border:1px solid #1E293B;border-radius:10px;transition:border-color 200ms}.glass:hover{border-color:#334155}
.pulse-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pulse-dot.online{background:#22C55E;box-shadow:0 0 8px #22C55E;animation:pulse 2s infinite}
.pulse-dot.warning{background:#F59E0B;box-shadow:0 0 6px #F59E0B;animation:pulse 1.5s infinite}
.pulse-dot.danger{background:#EF4444;box-shadow:0 0 6px #EF4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;font-family:monospace;font-size:13px;color:#64748B;transition:all 200ms}
.tab.active{color:#22C55E;border-bottom-color:#22C55E}.tab:hover{color:#94A3B8}
.btn{font-family:monospace;font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:all 150ms;border:none;font-weight:600}
.btn-pri{background:#22C55E;color:#020617}.btn-pri:hover{background:#16A34A;box-shadow:0 0 16px rgba(34,197,94,.3)}
.btn-danger{background:transparent;color:#EF4444;border:1px solid rgba(239,68,68,.3)}.btn-danger:hover{background:rgba(239,68,68,.1);border-color:#EF4444}
.btn-ghost{background:transparent;color:#94A3B8;border:1px solid #1E293B}.btn-ghost:hover{color:#F8FAFC;border-color:#334155}
.btn-info{background:transparent;color:#3B82F6;border:1px solid rgba(59,130,246,.3)}.btn-info:hover{background:rgba(59,130,246,.1)}
.status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;font-family:monospace}
.s-ok{background:rgba(34,197,94,.15);color:#22C55E;border:1px solid rgba(34,197,94,.3)}
.s-fail{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.3)}
.s-warn{background:rgba(245,158,11,.15);color:#F59E0B;border:1px solid rgba(245,158,11,.3)}
.kbd{font-family:monospace;font-size:10px;padding:1px 5px;border-radius:3px;background:#1E293B;border:1px solid #334155;color:#94A3B8}
.input{background:#0F172A;border:1px solid #1E293B;color:#F8FAFC;padding:8px 14px;border-radius:8px;font-family:monospace;font-size:13px;outline:none;width:100%}.input:focus{border-color:#22C55E}
.select{background:#0F172A;border:1px solid #1E293B;color:#F8FAFC;padding:8px 14px;border-radius:8px;font-family:monospace;font-size:13px;cursor:pointer}.select:hover{border-color:#22C55E}
.progress{height:4px;border-radius:2px;background:#1E293B;overflow:hidden}.progress .fill-g{background:#22C55E;height:100%;border-radius:2px}.fill-y{background:#F59E0B}.fill-r{background:#EF4444}.fill-b{background:#3B82F6}
.log{font-family:monospace;font-size:12px;padding:1px 0}.log.m{color:#64748B}.log.g{color:#22C55E}.log.y{color:#F59E0B}.log.b{color:#3B82F6}
.terminal{background:#020617;border:1px solid #1E293B;border-radius:8px;overflow:hidden}
.t-head{background:#0F172A;padding:8px 14px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #1E293B}
.t-dot{width:10px;height:10px;border-radius:50%}.t-dot.r{background:#EF4444}.t-dot.y{background:#F59E0B}.t-dot.g{background:#22C55E}
.t-body{padding:12px 14px;max-height:500px;overflow-y:auto;font-family:monospace;font-size:12px}
.typing::after{content:' ▌';animation:blink 1s step-end infinite;color:#22C55E}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#020617}::-webkit-scrollbar-thumb{background:#1E293B;border-radius:3px}
.tooltip-trigger{position:relative;display:inline-flex;align-items:center}
.tooltip-content{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #475569;color:#E2E8F0;padding:10px 14px;border-radius:8px;font-size:11px;line-height:1.6;white-space:normal;z-index:200;max-width:320px;font-family:'Fira Sans',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip-trigger:hover .tooltip-content{display:block}
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(148,163,184,.15);color:#94A3B8;font-size:12px;font-weight:700;cursor:help;transition:all 150ms}
.info-icon:hover{background:rgba(59,130,246,.2);color:#60A5FA}
.toast-panel{position:fixed;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:340px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.compare-col{border:2px dashed #1E293B;border-radius:8px;padding:12px}.compare-col.running{border-color:#22C55E;border-style:solid}
table{width:100%}th{text-align:left;padding:8px 12px;font-family:monospace;font-size:11px;text-transform:uppercase;color:#94A3B8;background:rgba(30,41,59,.3)}td{padding:8px 12px;font-size:12px;border-bottom:1px solid #1E293B}
</style>
</head>
<body class="min-h-screen p-6">
<div class="max-w-7xl mx-auto">

<!-- HEADER -->
<div class="flex items-center justify-between mb-4"><div class="flex items-center gap-4"><h1 class="font-bold text-xl" style="font-family:monospace"><span class="accent" style="color:#22C55E;text-shadow:0 0 14px rgba(34,197,94,.35)">◈</span> delegator</h1><span style="font-size:12px;color:#94A3B8">Mission Control</span><span style="color:#94A3B8;font-size:12px">|</span><select class="select" style="padding:4px 8px;font-size:12px" id="project-switcher" onchange="switchProject(this.value)"></select></div><div style="display:flex;gap:12px;align-items:center"><button class="btn btn-info" style="font-size:11px;padding:3px 10px" onclick="autoHeal()">🩺 Auto-Heal</button><button class="btn btn-ghost" style="font-size:11px;padding:3px 10px" onclick="document.body.classList.toggle('light')">☀ Theme</button></div></div>

<!-- ALERT BAR -->
<div id="alert-bar" class="glass mb-3 p-3" style="display:none;border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.04)"><div id="alert-msg" style="font-size:12px"></div></div>

<!-- METRICS -->
<div class="grid grid-cols-8 gap-2 mb-3" id="metrics-row"></div>

<!-- ACTIVE TASKS BANNER -->
<div class="glass mb-3" id="tasks-banner" style="display:none"><div style="display:flex;justify-content:space-between;padding:8px 14px;background:rgba(59,130,246,.04);border-bottom:1px solid rgba(59,130,246,.1)"><span style="font-size:12px;color:#3B82F6;font-family:monospace" id="task-count"></span><button class="btn btn-ghost" style="font-size:11px;padding:3px 8px" onclick="document.getElementById('task-cards').classList.toggle('hidden')">Collapse</button></div><div class="grid grid-cols-3 divide-x divide-border" id="task-cards"></div></div>

<!-- MAIN GRID -->
<div class="grid grid-cols-12 gap-3">
  <!-- LEFT: Agent Cards -->
  <div class="col-span-2" id="agent-cards"></div>

  <!-- RIGHT: Tabs -->
  <div class="col-span-10">
    <div class="flex gap-0 border-b border-border" id="tab-bar"></div>
    <div class="mt-3" id="tab-content"><div class="text-center text-muted text-sm pt-8">Loading...</div></div>
  </div>
</div>
</div>

<!-- TOAST PANEL -->
<div class="toast-panel"></div>

<!-- BOTTOM BAR -->
<div style="position:fixed;bottom:0;left:0;right:0;background:#0F172A;border-top:1px solid #1E293B;padding:6px 24px;z-index:100;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;gap:24px"><span><span class="kbd">L</span> Live</span><span><span class="kbd">O</span> Logs</span><span><span class="kbd">H</span> History</span><span><span class="kbd">A</span> Analytics</span><span><span class="kbd">C</span> Compare</span><span><span class="kbd">Q</span> Queue</span><span><span class="kbd">E</span> Exec</span><span><span class="kbd">S</span> Settings</span><span style="color:#64748B">|</span><span><span class="kbd">1-3</span> Tasks</span><span><span class="kbd">F7</span> Project</span><span><span class="kbd">⌘K</span> Focus Exec</span><span><span class="kbd">?</span> Help</span></div>

<script>
let liveTaskId=null,activeTab='live',settingsTab='routing';
const TABS=['live','logs','history','analytics','compare','queue','exec','settings'];
const SETTINGS_TABS=['routing','control','notifications','general'];
async function api(u,o){try{const r=await fetch(u,o);return r.ok?r.json():null}catch(e){return null}}

// === RENDER FUNCTIONS (each generates HTML from API data) ===

async function renderAll(){
  const d=await api('/api/status');if(!d)return;
  renderMetrics(d);renderAgents(d);renderTasks(d);renderAlert(d);
}

function renderMetrics(d){
  const m=[['Active Agents',d.agents.length,'#22C55E'],['Running',d.active_tasks.length,'#3B82F6'],['7d Dels',d.recent_dels,'#F8FAFC'],['Success',Math.round((d.success_rate||0)*100)+'%','#22C55E'],['Cooldowns',d.cooldowns.length,'#F59E0B'],['Queued',d.pending_queue||0,'#8B5CF6'],['Routes',14,'#EC4899'],['Cost','$'+(d.agents||[]).reduce((s,a)=>(s+(a.est_cost||0)),0).toFixed(2),'#06B6D4']];
  document.getElementById('metrics-row').innerHTML=m.map(([l,v,c])=>`<div class="glass p-2 text-center"><div style="font-family:monospace;font-size:16px;font-weight:700;color:${c}">${v}</div><div style="font-size:9px;color:#64748B;text-transform:uppercase">${l}</div></div>`).join('')
}

function renderAgents(d){
  document.getElementById('agent-cards').innerHTML=d.agents.map(a=>`<div class="glass p-2 cursor-pointer" style="margin-bottom:6px" onclick="openAgentModal('${a.name}')"><div style="display:flex;align-items:center;gap:8px"><span class="pulse-dot ${a.available?'online':'danger'}"></span><span style="font-family:monospace;font-size:12px;font-weight:600">${a.name}</span><span style="font-size:10px;color:#06B6D4;margin-left:auto">$${a.est_cost||0}</span></div><div style="font-size:10px;color:#64748B">${a.current_model||'—'}</div><div style="display:flex;align-items:center;margin-top:4px;gap:6px"><div class="progress" style="flex:1"><div class="fill-g" style="width:${Math.round((a.success_rate||0)*100)}%"></div></div><span style="font-size:10px;font-family:monospace;color:#22C55E">${Math.round((a.success_rate||0)*100)}%</span></div><div style="font-size:9px;color:#64748B;margin-top:2px">${a.model_count} models · ${a.del_count||0} dels</div></div>`).join('')
}

function renderTasks(d){
  const tasks=d.active_tasks||[];
  const banner=document.getElementById('tasks-banner');
  if(!tasks.length){banner.style.display='none';return}
  banner.style.display='';
  document.getElementById('task-count').innerHTML=`<span class="pulse-dot online" style="margin-right:6px"></span>${tasks.length} Active · Press 1-${Math.min(tasks.length,9)} for live view`;
  document.getElementById('task-cards').innerHTML=tasks.map((t,i)=>`<div class="glass p-3 cursor-pointer" style="border:none" onclick="if(!this.classList.contains('sel')){document.querySelectorAll('#task-cards .glass').forEach(e=>e.classList.remove('sel'));this.classList.add('sel');liveTaskId='${t.id}';switchTab('live')}"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-family:monospace;font-size:11px;color:#3B82F6">#${(t.id||'').slice(0,8)}</span><button class="btn btn-danger" style="padding:2px 6px;font-size:9px" onclick="event.stopPropagation();stopTask('${t.id}')">Stop</button></div><div style="font-size:11px;color:#64748B">${t.agent||'—'} · ${t.model||'—'}</div><div style="font-size:11px;color:#F8FAFC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.task||'—'}</div><div class="progress" style="margin-top:4px"><div class="fill-g" style="width:${Math.min(Math.round((Date.now()/1000-(t.started_at||Date.now()/1000))/60*100),95)}%"></div></div><div style="font-size:9px;color:#64748B;font-family:monospace;margin-top:2px">${Math.round(Date.now()/1000-(t.started_at||Date.now()/1000))}s</div></div>`).join('')
}

function renderAlert(d){
  const cds=d.cooldowns||[];const ab=document.getElementById('alert-bar');
  if(!cds.length){ab.style.display='none';return}
  ab.style.display='';document.getElementById('alert-msg').innerHTML=`<span style="color:#EF4444;font-family:monospace;font-size:11px">⚠ ${cds.length} agent(s) in cooldown:</span> ${cds.map(c=>`<span style="font-family:monospace;font-size:11px;color:#F59E0B;margin:0 8px">${c.key}</span>`).join('')}<button class="btn btn-info" style="font-size:10px;padding:3px 8px;margin-left:12px" onclick="autoHeal()">Auto-Heal All</button><button class="btn btn-ghost" style="font-size:10px;padding:3px 8px;margin-left:6px" onclick="document.getElementById('alert-bar').style.display='none'">Dismiss</button>`
}

// === TAB RENDERERS ===

async function renderLive(){const d=await api('/api/tasks/'+(liveTaskId||'')+'/output');document.getElementById('tab-content').innerHTML=`<div class="terminal"><div class="t-head"><div class="t-dot g"></div><span style="font-family:monospace;font-size:12px;color:#64748B">delegator live — ${liveTaskId||'no task selected'}</span></div><div class="t-body" style="max-height:550px"><div class="log g">${d?d.output||'(waiting for output...)</div>':'Click an active task above to view live output'}</div></div><div class="glass p-3 mt-2" style="display:flex;gap:8px"><button class="btn btn-danger" onclick="stopTask()">Stop</button><button class="btn btn-ghost" onclick="execTask()">Rerun</button><button class="btn btn-ghost" onclick="navigator.clipboard.writeText(document.querySelector('.t-body').textContent);alert('Copied!')">Copy</button></div>`}

async function renderLogs(){const d=await api('/api/logs?limit=200');const entries=d?d.entries:[];document.getElementById('tab-content').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center"><select class="select" style="padding:4px 8px;font-size:11px" onchange="renderLogsFiltered()"><option>All agents</option>${[...new Set(entries.map(e=>e.agent))].map(a=>`<option>${a}</option>`).join('')}</select><select class="select" style="padding:4px 8px;font-size:11px" onchange="renderLogsFiltered()"><option>All levels</option><option>ERROR</option><option>INFO</option></select><input class="input" style="max-width:200px;padding:4px 8px;font-size:11px" placeholder="Search..." onkeyup="searchLogs()"><span style="font-size:11px;color:#64748B;font-family:monospace;margin-left:auto">${entries.length} entries</span><label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" checked class="accent-green-500" onchange="this.checked=!this.checked"><span style="font-size:10px;color:#64748B;font-family:monospace">Auto</span></label><button class="btn btn-ghost" style="font-size:10px;padding:3px 8px" onclick="exportText('logs')">Export</button></div><div class="terminal" style="max-height:550px;overflow-y:auto" id="log-stream">${entries.map(e=>`<div style="display:flex;gap:8px;padding:2px 12px;align-items:flex-start;font-family:monospace;font-size:11px;${e.level==='ERROR'?'background:rgba(239,68,68,.05)':''}"><span style="color:#64748B;white-space:nowrap">${e.timestamp||'—'}</span><span style="color:#64748B;white-space:nowrap;min-width:70px">${e.agent||'—'}</span><span style="color:#3B82F6;min-width:70px">#${(e.task_id||'').slice(0,8)}</span><span style="min-width:40px;color:${e.level==='ERROR'?'#EF4444':'#3B82F6'}">${e.level}</span><span style="color:#F8FAFC">${e.message||''}</span></div>`).join('')||'<div style="text-align:center;color:#64748B;padding:20px">No log entries yet. Run delegations to see data.</div>'}</div>`}
let logEntries=[];async function renderLogsFiltered(){const d=await api('/api/logs?limit=500');logEntries=d?d.entries:[];filterLogEntries()}function searchLogs(){filterLogEntries()}function filterLogEntries(){const ag=document.querySelector('#tab-content select')?.value;const lv=document.querySelectorAll('#tab-content select')[1]?.value;const q=document.querySelector('#tab-content input')?.value?.toLowerCase()||'';let e=logEntries;if(ag&&ag!=='All agents')e=e.filter(x=>x.agent===ag);if(lv&&lv!=='All levels')e=e.filter(x=>x.level===lv);if(q)e=e.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('log-stream').innerHTML=e.map(e=>`<div style="display:flex;gap:8px;padding:2px 12px;align-items:flex-start;font-family:monospace;font-size:11px;${e.level==='ERROR'?'background:rgba(239,68,68,.05)':''}"><span style="color:#64748B;white-space:nowrap">${e.timestamp||'—'}</span><span style="color:#64748B;white-space:nowrap;min-width:70px">${e.agent||'—'}</span><span style="color:#3B82F6;min-width:70px">#${(e.task_id||'').slice(0,8)}</span><span style="min-width:40px;color:${e.level==='ERROR'?'#EF4444':'#3B82F6'}">${e.level}</span><span style="color:#F8FAFC">${e.message||''}</span></div>`).join('')||'<div style="text-align:center;color:#64748B;padding:20px">No matching entries</div>'}

async function renderHistory(){const d=await api('/api/metrics?days=14&limit=100');const dels=d?d.delegations:[];document.getElementById('tab-content').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:8px"><select class="select" style="padding:4px 8px;font-size:11px" onchange="renderHistory()"><option>All agents</option>${[...new Set(dels.map(r=>r.to_agent||r.provider_used||'—'))].map(a=>`<option>${a}</option>`).join('')}</select><span style="font-size:11px;color:#64748B;font-family:monospace;margin-left:auto">${dels.length} records</span><button class="btn btn-ghost" style="font-size:10px;padding:3px 8px" onclick="exportText('history')">CSV Export</button></div><div class="glass" style="max-height:550px;overflow-y:auto"><table><thead><tr><th>Time</th><th>Agent</th><th>Model</th><th>Task</th><th>WF</th><th>Dur</th><th>FB</th><th>Status</th><th></th></tr></thead><tbody>${dels.map(r=>`<tr><td style="font-family:monospace;color:#64748B;font-size:10px">${(r.timestamp||'').slice(11,16)||'—'}</td><td style="font-family:monospace;font-size:10px">${r.to_agent||r.provider_used||'—'}</td><td style="font-family:monospace;font-size:10px;color:#22C55E">${(r.model||'').slice(0,20)}</td><td style="font-size:10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.task_type||''}">${r.task_type||'—'}</td><td style="font-family:monospace;font-size:10px;color:#64748B">${r.workflow||'—'}</td><td style="font-family:monospace;font-size:10px;color:#64748B;text-align:center">${r.duration_ms?Math.round(r.duration_ms/1000)+'s':'—'}</td><td style="font-family:monospace;font-size:10px;color:#64748B;text-align:center">${r.fallback_count||0}</td><td style="text-align:center"><span class="status ${r.success?'s-ok':'s-fail'}">${r.success?'OK':'FAIL'}</span></td><td style="text-align:center"><button class="btn btn-ghost" style="padding:2px 6px;font-size:9px" onclick="viewDelegation('${r.id}')">View</button>${!r.success?`<button class="btn btn-ghost" style="padding:2px 6px;font-size:9px;margin-left:2px" onclick="execTask()">Retry</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;color:#64748B">No delegations yet</td></tr>'}</tbody></table></div>`
}
async function viewDelegation(id){const d=await api('/api/metrics?days=30&limit=100');if(!d)return;const del=d.delegations.find(r=>r.id===id);alert(del?`#${del.id}\nAgent: ${del.to_agent}\nModel: ${del.model}\nWorkflow: ${del.workflow}\nTask: ${del.task_type}\nDuration: ${del.duration_ms||0}ms\nFallbacks: ${del.fallback_count||0}\nSuccess: ${del.success}`:'Task not found')}

async function renderAnalytics(){const d=await api('/api/metrics?days=14&limit=200');if(!d)return;const dels=d.delegations;const byAgent={};dels.forEach(r=>{const a=r.to_agent||'?';byAgent[a]=(byAgent[a]||0)+1});const max=Math.max(1,...Object.values(byAgent));const byDay={};dels.forEach(r=>{const dd=(r.timestamp||'').slice(0,10);if(!byDay[dd])byDay[dd]={t:0,o:0};byDay[dd].t++;if(r.success)byDay[dd].o++});const days=Object.entries(byDay).slice(-7);const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const costs={};dels.forEach(r=>{const a=r.to_agent||'?';costs[a]=(costs[a]||0)+(r.duration_ms||0)*0.000001});const fails=dels.filter(r=>!r.success);document.getElementById('tab-content').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px"><div class="glass p-3"><div style="font-size:10px;color:#64748B;text-transform:uppercase;font-family:monospace;margin-bottom:8px">Success Rate (7d)</div><div style="display:flex;align-items:flex-end;gap:2px;height:80px">${days.map(([dd,data])=>{const d=new Date(dd+'T00:00:00');const pct=data.t?Math.round(data.o/data.t*100):0;const cls=pct>80?'g':pct>50?'y':'r';return`<div style="display:flex;flex-direction:column;align-items:center"><div class="progress" style="height:${pct}%;width:14px"><div class="fill-${cls}" style="width:100%;border-radius:2px"></div></div><span style="font-size:8px;color:#64748B;margin-top:2px" title="${dd}: ${data.o}/${data.t}">${dn[d.getDay()]}</span></div>`}).join('')}</div></div><div class="glass p-3"><div style="font-size:10px;color:#64748B;text-transform:uppercase;font-family:monospace;margin-bottom:8px">By Agent</div>${Object.entries(byAgent).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`<div style="margin-bottom:4px"><div style="display:flex;justify-content:space-between;font-size:9px;font-family:monospace"><span>${a}</span><span style="color:#22C55E">${c}</span></div><div class="progress"><div class="fill-g" style="width:${Math.round(c/max*100)}%"></div></div></div>`).join('')}</div><div class="glass p-3"><div style="font-size:10px;color:#64748B;text-transform:uppercase;font-family:monospace;margin-bottom:8px">Cost (7d)</div>${Object.entries(costs).map(([a,c])=>`<div style="display:flex;justify-content:space-between;font-size:10px;font-family:monospace;margin-bottom:2px"><span>${a}</span><span style="color:#06B6D4">$${c.toFixed(2)}</span></div>`).join('')}<div style="border-top:1px solid #1E293B;padding-top:4px;margin-top:4px;display:flex;justify-content:space-between;font-size:10px;font-family:monospace;font-weight:700"><span>Total</span><span style="color:#06B6D4">$${Object.values(costs).reduce((a,b)=>a+b,0).toFixed(2)}</span></div><div style="display:flex;gap:4px;margin-top:8px"><button class="btn btn-ghost" style="font-size:9px;padding:3px 6px;flex:1" onclick="exportCSV()">CSV</button><button class="btn btn-ghost" style="font-size:9px;padding:3px 6px;flex:1" onclick="exportCSV()">PDF</button></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="glass p-3"><div style="font-size:10px;color:#64748B;text-transform:uppercase;font-family:monospace;margin-bottom:8px">Failures</div>${[['Rate Limit',fails.filter(r=>r.fallback_count>0).length,'y'],['Other',fails.filter(r=>r.fallback_count===0).length,'r']].map(([l,v,c])=>`<div style="margin-bottom:4px"><div style="display:flex;justify-content:space-between;font-size:9px;font-family:monospace"><span>${l}</span><span style="color:#F59E0B">${v}</span></div><div class="progress"><div class="fill-${c}" style="width:${v}%"></div></div></div>`).join('')}</div><div class="glass p-3"><div style="font-size:10px;color:#64748B;text-transform:uppercase;font-family:monospace;margin-bottom:8px">Learned Rankings</div>${dels.filter((r,i,a)=>a.findIndex(x=>x.to_agent===r.to_agent)===i).slice(0,5).map(r=>{const ad=dels.filter(x=>x.to_agent===r.to_agent);const sc=ad.filter(x=>x.success).length/ad.length;return`<div style="display:flex;justify-content:space-between;font-size:10px;font-family:monospace;margin-bottom:2px"><span style="color:${sc>0.8?'#22C55E':sc>0.5?'#F59E0B':'#EF4444'}">${r.to_agent||'?'}</span><span>${sc.toFixed(2)}</span><span style="color:#64748B">${ad.length} dels</span></div>`}).join('')}</div></div>`
}

async function renderCompare(){const models=['opencode-go/deepseek-v4-pro','claude-sonnet-4-6','opencode-go/minimax-m2.7','federated-coding','federated-free','copilot/gpt-5.4'];document.getElementById('tab-content').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:8px"><input class="input" value="" placeholder="Task description..." id="compare-task" style="flex:1"><button class="btn btn-pri" onclick="runCompare()">Run A/B Test</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="compare-col"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-family:monospace;font-size:12px">A:</span><select class="select compare-sel" style="padding:4px 8px;font-size:11px">${models.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="terminal" style="min-height:200px"><div class="t-head"><div class="t-dot g"></div><span style="font-size:10px;color:#64748B;font-family:monospace">Output</span></div><div class="t-body" style="min-height:150px"><div style="color:#64748B">Ready. Enter a task and click Run A/B Test.</div></div></div></div><div class="compare-col"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-family:monospace;font-size:12px">B:</span><select class="select compare-sel" style="padding:4px 8px;font-size:11px">${models.map(m=>`<option ${m==='claude-sonnet-4-6'?'selected':''}>${m}</option>`).join('')}</select></div><div class="terminal" style="min-height:200px"><div class="t-head"><div class="t-dot g"></div><span style="font-size:10px;color:#64748B;font-family:monospace">Output</span></div><div class="t-body" style="min-height:150px"><div style="color:#64748B">Ready.</div></div></div></div></div>`

async function runCompare(){const task=document.getElementById('compare-task')?.value;if(!task)return;const ma=document.querySelectorAll('.compare-sel')[0]?.value;const mb=document.querySelectorAll('.compare-sel')[1]?.value;document.querySelectorAll('#tab-content .t-body').forEach(b=>b.innerHTML='<div style="color:#3B82F6;font-family:monospace;font-size:11px">Running...</div>');const d=await api('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,model_a:ma,model_b:mb})});if(!d)return;['A','B'].forEach((lbl,i)=>{const r=d.results[lbl];if(r){const b=document.querySelectorAll('#tab-content .t-body')[i];if(b)b.innerHTML=`<div class="log g">Provider: ${r.provider||'—'}</div><div class="log m">Duration: ${r.duration_ms?Math.round(r.duration_ms/1000)+'s':'—'}</div><div class="log m">Fallbacks: ${r.fallback_count||0}</div><div class="log ${r.success?'g':'y'}">${r.success?'✅ Success':'❌ Failed'}</div>`}})}

="width:100%;font-size:10px;padding:4px;margin-top:6px" onclick="addPending()">+ Enqueue Task</button></div></div>`
}

// === TAB SWITCHING ===
function switchTab(t){activeTab=t;document.querySelectorAll('#tab-bar .tab').forEach((e,i)=>{e.classList.toggle('active',TABS[i]===t)});if(t==='live')renderLive();if(t==='logs')renderLogs();if(t==='history')renderHistory();if(t==='analytics')renderAnalytics();if(t==='compare')renderCompare();if(t==='queue')renderQueue();if(t==='exec')renderExec();if(t==='settings')renderSettings()}

// === ACTION FUNCTIONS ===
async function execTask(){const t=document.getElementById('exec-task');if(!t?.value)return switchTab('exec');const r=await api('/api/exec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:t.value,model:document.getElementById('exec-model')?.value||'federated-coding',workflow:document.getElementById('exec-wf')?.value||'subagent-driven',from_agent:document.getElementById('exec-from')?.value||'',stream:document.getElementById('exec-stream')?.checked||false,no_worktree:document.getElementById('exec-nowt')?.checked||false})});if(r){liveTaskId=r.task_id;switchTab('live');renderAll();showToast('Task started: '+r.status)}}
async function stopTask(id){await api('/api/tasks/'+(id||liveTaskId||'')+'/stop',{method:'POST'});showToast('Task stopped');renderAll()}
async function autoHeal(){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'auto_heal'})});renderAll();showToast('Cooldowns reset')}
async function execFromQueue(task,model){const r=await api('/api/exec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,model:model||'federated-coding',no_worktree:true})});if(r){liveTaskId=r.task_id;switchTab('live');renderAll()}}
async function startQueuedFromAPI(idx){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'start_queued',index:idx})});switchTab('queue')}
async function addScheduled(){const t=prompt('Task:');if(!t)return;const m=prompt('Model (federated-coding):')||'federated-coding';const c=prompt('Cron (e.g. 0 2 * * *):')||'';await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'add_scheduled',task:t,model:m,workflow:'subagent-driven',cron:c})});switchTab('queue')}
async function addPending(){const t=prompt('Task:');if(!t)return;await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'add_pending',task:t,model:'federated-coding',workflow:'subagent-driven'})});switchTab('queue')}
async function saveRouting(){const pri=[];document.querySelectorAll('#settings-sub .glass .glass').forEach(e=>{const n=e.querySelector('span');if(n)pri.push(n.textContent.replace(/^\d+\.\s*/,''))});await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'routing_priority',priority:pri})});alert('Saved')}
async function saveCircuitBreaker(){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'cooldown',config:{failure_threshold:+document.getElementById('cb-thresh')?.value||3,base_minutes:+document.getElementById('cb-base')?.value||5,max_minutes:+document.getElementById('cb-max')?.value||60,worktree_ttl:+document.getElementById('cb-ttl')?.value||24}})});alert('Saved')}
async function saveTelegramConfig(){const ev=[];document.querySelectorAll('.tg-ev:checked').forEach(c=>ev.push(c.value));await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'notifications',notifications:{telegram:{bot_token:document.getElementById('tg-token')?.value||'',chat_id:document.getElementById('tg-chat')?.value||'',events:ev},webhooks:{slack_url:document.getElementById('wh-url')?.value||'',events:[]}}})});alert('Saved')}
async function saveWebhookConfig(){const ev=[];document.querySelectorAll('.wh-ev:checked').forEach(c=>ev.push(c.value));await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'notifications',notifications:{webhooks:{slack_url:document.getElementById('wh-url')?.value||'',events:ev},telegram:{bot_token:document.getElementById('tg-token')?.value||'',chat_id:document.getElementById('tg-chat')?.value||'',events:[]}}})});alert('Saved')}
async function sendTestTelegram(){const tok=document.getElementById('tg-token')?.value;const cid=document.getElementById('tg-chat')?.value;if(!tok||!cid)return alert('Enter bot token and chat ID');await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'test_telegram',token:tok,chat_id:cid})});alert('Test sent!')}
async function sendTestWebhook(){const url=document.getElementById('wh-url')?.value;if(!url)return alert('Enter webhook URL');await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'test_webhook',url})});alert('Test sent!')}
async function savePreferences(){alert('Saved')}
async function clearHistory(){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'clear_history'})});alert('Cleared')}
async function resetRankings(){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'reset_rankings'})});alert('Reset')}
async function switchProject(path){await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});renderAll()}
async function loadProjects(){const d=await api('/api/projects');if(!d)return;const sel=document.getElementById('project-switcher');if(sel){sel.innerHTML=d.projects.map(p=>`<option value="${p.path}" ${p.path===d.current?'selected':''}>📁 ${p.name}</option>`).join('')}}


async function openAgentModal(agentName){const d=await api('/api/agents/'+agentName);if(!d?.models)return;const html=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)this.remove()"><div class="glass" style="padding:20px;max-width:550px;width:90%;max-height:80vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-family:monospace;font-size:14px">${agentName} — Details</h3><span style="cursor:pointer;font-size:20px;color:#64748B" onclick="this.closest('div').parentElement.remove()">×</span></div><table><thead><tr><th>Model</th><th>Capabilities</th><th>Dels</th><th>Success</th></tr></thead><tbody>${d.models.map(m=>`<tr><td style="font-family:monospace;font-size:11px;color:#22C55E">${m.id}</td><td style="font-size:10px">${(m.capabilities||[]).map(c=>`<span class="status s-info" style="margin:1px">${c}</span>`).join('')}</td><td style="font-family:monospace;font-size:10px;text-align:center">${m.total_dels}</td><td style="font-family:monospace;font-size:10px;text-align:center;color:${m.success_rate>0.8?'#22C55E':'#F59E0B'}">${Math.round(m.success_rate*100)}%</td></tr>`).join('')}</tbody></table></div></div>`;document.body.insertAdjacentHTML('beforeend',html)}

function showToast(msg){const p=document.querySelector('.toast-panel');if(!p)return;const d=document.createElement('div');d.className='glass p-3';d.style.cssText='animation:slideIn .3s ease;display:flex;align-items:center;gap:8px;font-family:monospace;font-size:11px';d.innerHTML=`<span class="pulse-dot online"></span>${msg}<span style="cursor:pointer;margin-left:auto;font-size:14px" onclick="this.parentElement.remove()">×</span>`;p.appendChild(d);setTimeout(()=>d.remove(),8000)}
function exportText(type){const c=document.getElementById('tab-content')?.textContent||'';const b=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`delegator-${type}.txt`;a.click()}
function exportCSV(){exportText('analytics')}

// === INITIALIZATION ===
(async function init(){
  document.getElementById('tab-bar').innerHTML=TABS.map(t=>`<div class="tab ${t===activeTab?'active':''}" onclick="switchTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</div>`).join('');
  await loadProjects();
  await renderAll();
  switchTab('live');
  // Polling
  setInterval(renderAll,5000);
  setInterval(()=>{if(activeTab==='logs')renderLogs()},8000);
  setInterval(()=>{if(activeTab==='live'&&liveTaskId)renderLive()},4000);
})();

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea'))return;
  const m={'l':'live','o':'logs','h':'history','a':'analytics','c':'compare','q':'queue','e':'exec','s':'settings'};
  if(m[e.key])switchTab(m[e.key]);
  if(e.key==='F7'){e.preventDefault();document.getElementById('project-switcher')?.focus()}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();switchTab('exec');document.getElementById('exec-task')?.focus()}
  if(e.key==='?'){e.preventDefault();showToast('Shortcuts: L Live O Logs H History A Analytics C Compare Q Queue E Exec S Settings. 1-3 Tasks. F7 Project. ⌘K Focus Exec. Esc Close')}
})
</script>
