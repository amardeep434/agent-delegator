[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-delegator"
version = "0.2.0"
description = "Agent-agnostic AI CLI delegation with federated model failover"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Amardeep", email = "amardeep434@gmail.com"},
]
keywords = ["ai", "cli", "delegation", "agents", "llm", "federation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
secure = ["cryptography>=3.0"]
dev = ["pytest>=7.0", "build>=1.0", "cryptography>=3.0"]
all = ["cryptography>=3.0"]

[project.scripts]
agent-delegator = "agent_delegator.cli:main"

[project.urls]
Homepage = "https://github.com/amardeep434/agent-delegator"
Repository = "https://github.com/amardeep434/agent-delegator"
Issues = "https://github.com/amardeep434/agent-delegator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_delegator*"]
exclude = ["tests*", "mockups*", "docs*"]

[tool.setuptools.package-data]
agent_delegator = ["registry.json", "dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
